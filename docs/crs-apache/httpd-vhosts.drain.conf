# Inspect-only vhosts for ghcr.io/coreruleset/modsecurity-crs:apache (CRS 4.2x+),
# for the traefik-modsecurity plugin. Mount over
# /usr/local/apache2/conf/extra/httpd-vhosts.conf.

Mutex ${MUTEX}

RemoteIPHeader ${REMOTEIP_HEADER}
RemoteIPInternalProxy ${REMOTEIP_INT_PROXY}

# A tiny 200 must not turn into a 304 or 416 (the plugin forwards 3xx/4xx).
RequestHeader unset Range early
RequestHeader unset If-Range early
RequestHeader unset If-Modified-Since early
RequestHeader unset If-None-Match early

ServerName ${SERVER_NAME}
ServerAdmin ${SERVER_ADMIN}

UseCanonicalName on

<Location />
    RewriteEngine On
    RewriteRule .* - [R=200,L]
    ErrorDocument 200 "OK"
</Location>

<VirtualHost *:${PORT}>
  Protocols ${H2_PROTOCOLS}
  H2Direct ${H2_DIRECT}
</VirtualHost>

<VirtualHost *:${SSL_PORT}>
  Protocols ${H2_PROTOCOLS}
  H2Direct ${H2_DIRECT}
  SSLEngine ${SSL_ENGINE}
  SSLCertificateFile ${SSL_CERT_FILE}
  SSLCertificateKeyFile ${SSL_CERT_KEY_FILE}
</VirtualHost>
