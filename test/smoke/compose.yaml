name: traefik-smoke

services:
  traefik:
    image: ${IMAGE:?set IMAGE to the image under test}
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro

  whoami:
    image: traefik/whoami:v1.12.0
